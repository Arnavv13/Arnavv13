<text x="42" y="105" fill="#f4f6ff" font-family="Arial,sans-serif" font-size="31" font-weight="700">Curious by nature. Builder by practice.</text>
<text x="42" y="148" fill="#b7c4dc" font-family="Arial,sans-serif" font-size="19">I'm a computer science student focused on turning ideas into useful software.</text>
<text x="42" y="179" fill="#b7c4dc" font-family="Arial,sans-serif" font-size="19">I enjoy learning how products work, solving problems, and improving with every project.</text>
